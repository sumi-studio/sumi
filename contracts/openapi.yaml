openapi: 3.1.0
info:
  title: Sumi API
  version: 0.1.0
paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
  /conversations/{conversation_id}/commands:
    post:
      operationId: createUserCommand
      summary: Create a user command in a conversation
      description: |
        Admits a user_message command from the web client. The request is
        validated for UTF-8 JSON shape, empty attachments, and a 1 MiB wire-size
        limit before any command_id or seq is allocated. Rejections are returned
        as typed 4xx responses with no command_id/seq, so they cannot create a
        sequence gap in the durable command log.
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, text, attachments]
              additionalProperties: false
              properties:
                type:
                  type: string
                  enum: [user_message]
                text:
                  type: string
                attachments:
                  type: array
                  maxItems: 0
      responses:
        "201":
          description: Command accepted and allocated a durable seq and command_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandEnvelope"
        "400":
          description: Command rejected before seq/command_id allocation
          content:
            application/json:
              schema:
                type: object
                required: [error, reject_reason]
                additionalProperties: false
                properties:
                  error:
                    type: string
                    enum: [invalid_command]
                  reject_reason:
                    type: string
                    enum:
                      - unknown_command
                      - schema_violation
                      - attachments_not_empty
                      - oversized
components:
  schemas:
    CommandEnvelope:
      type: object
      required: [seq, command_id, command]
      additionalProperties: false
      properties:
        seq:
          type: integer
          minimum: 0
        command_id:
          type: string
          format: uuid
        command:
          $ref: "#/components/schemas/UserMessageCommand"
    UserMessageCommand:
      type: object
      required: [type, text, attachments]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [user_message]
        text:
          type: string
        attachments:
          type: array
          maxItems: 0
