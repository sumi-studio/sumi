openapi: 3.1.0
info:
  title: Sumi API
  version: 0.1.0
paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                additionalProperties: false
                properties:
                  status:
                    type: string
                    enum: [ok]
  /workspaces:
    get:
      operationId: listWorkspaces
      summary: List the authenticated Human's active Workspace memberships
      security:
        - sumiSession: []
      responses:
        "200":
          description: Side-effect-free Workspace projection; an empty list is valid
          content:
            application/json:
              schema:
                type: object
                required: [workspaces]
                additionalProperties: false
                properties:
                  workspaces:
                    type: array
                    items:
                      $ref: "#/components/schemas/Workspace"
        "401":
          description: Missing or invalid browser session
    post:
      operationId: createWorkspace
      summary: Atomically create a Workspace and its immutable owner membership
      description: Actor identity comes only from the signed browser session. Origin is checked before the body is processed.
      security:
        - sumiSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceCreateRequest"
      responses:
        "201":
          description: Workspace created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          description: Missing, invalid, or concurrently revoked browser session
        "403":
          description: Origin not allowed or authenticated actor cannot create the resource
  /workspaces/{workspace_id}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: getWorkspace
      summary: Read one visible Workspace
      description: A nonexistent Workspace and one outside the caller's active memberships have the same response.
      security:
        - sumiSession: []
      responses:
        "200":
          description: Workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "401":
          description: Missing or invalid browser session
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateWorkspace
      summary: Update Workspace presentation under manage_workspace
      security:
        - sumiSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceUpdateRequest"
      responses:
        "200":
          description: Updated Workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          description: Missing, invalid, or concurrently revoked browser session
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspaces/{workspace_id}/members:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listWorkspaceMembers
      summary: List active Workspace membership tenures
      security:
        - sumiSession: []
      responses:
        "200":
          description: Active memberships
          content:
            application/json:
              schema:
                type: object
                required: [members]
                additionalProperties: false
                properties:
                  members:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkspaceMembership"
        "401":
          description: Missing or invalid browser session
        "404":
          $ref: "#/components/responses/NotFound"
  /workspaces/{workspace_id}/membership:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    delete:
      operationId: leaveWorkspace
      summary: Close the authenticated Human's current non-owner membership tenure
      security:
        - sumiSession: []
      responses:
        "204":
          description: Membership tenure closed
        "401":
          description: Missing, invalid, or concurrently revoked browser session
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspaces/{workspace_id}/members/{workspace_member_id}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/WorkspaceMemberId"
    delete:
      operationId: removeWorkspaceMember
      summary: Close another active membership tenure under manage_members
      security:
        - sumiSession: []
      responses:
        "204":
          description: Membership tenure closed
        "401":
          description: Missing, invalid, or concurrently revoked browser session
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspaces/{workspace_id}/invites:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      operationId: createWorkspaceInvite
      summary: Create a single-use 24-hour opaque Workspace invite
      description: The plaintext code is returned once. Its issuing membership tenure and manage_members authority are rechecked at redemption.
      security:
        - sumiSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "201":
          description: Invite created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceInvite"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          description: Missing, invalid, or concurrently revoked browser session
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspaces/{workspace_id}/invites/{invite_id}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - name: invite_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/UUIDv7"
    delete:
      operationId: revokeWorkspaceInvite
      summary: Revoke an invite under manage_members
      security:
        - sumiSession: []
      responses:
        "204":
          description: Invite revoked
        "401":
          description: Missing, invalid, or concurrently revoked browser session
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspace-invites/preview:
    get:
      operationId: previewWorkspaceInvite
      summary: Preview the Workspace named by an opaque invite without consuming it
      description: Possession of the code reveals only the Workspace ID, display name, and fixed expiry. It reveals no member list or issuer identity.
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: Minimal non-consuming invite preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceInvitePreview"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspace-invites/redeem:
    post:
      operationId: redeemWorkspaceInvite
      summary: Redeem an opaque invite as the authenticated Human
      description: A successful exact same-actor retry returns the original membership. Redemption never assigns roles.
      security:
        - sumiSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              additionalProperties: false
              properties:
                code:
                  type: string
                  minLength: 1
                  maxLength: 128
      responses:
        "200":
          description: New membership or the exact prior redemption result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMembership"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          description: Missing, invalid, or concurrently revoked browser session
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /workspaces/{workspace_id}/roles:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listWorkspaceRoles
      summary: List custom Workspace roles
      security:
        - sumiSession: []
      responses:
        "200":
          description: Custom roles
          content:
            application/json:
              schema:
                type: object
                required: [roles]
                additionalProperties: false
                properties:
                  roles:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkspaceRole"
        "401":
          description: Missing or invalid browser session
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createWorkspaceRole
      summary: Create a role under manage_roles and the caller's privilege ceiling
      security:
        - sumiSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceRoleMutation"
      responses:
        "201":
          description: Role created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceRole"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          description: Missing, invalid, or concurrently revoked browser session
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /workspaces/{workspace_id}/roles/{role_id}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/RoleId"
    patch:
      operationId: updateWorkspaceRole
      summary: Update a role under manage_roles and the caller's privilege ceiling
      security:
        - sumiSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceRoleMutation"
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceRole"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          description: Missing, invalid, or concurrently revoked browser session
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteWorkspaceRole
      summary: Delete a role under manage_roles and the caller's privilege ceiling
      security:
        - sumiSession: []
      responses:
        "204":
          description: Role deleted
        "401":
          description: Missing, invalid, or concurrently revoked browser session
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspaces/{workspace_id}/members/{workspace_member_id}/roles:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/WorkspaceMemberId"
    put:
      operationId: setWorkspaceMemberRoles
      summary: Replace the roles attached to one exact membership tenure
      security:
        - sumiSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role_ids]
              additionalProperties: false
              properties:
                role_ids:
                  type: array
                  uniqueItems: true
                  items:
                    $ref: "#/components/schemas/UUIDv7"
      responses:
        "200":
          description: Stored role IDs
          content:
            application/json:
              schema:
                type: object
                required: [role_ids]
                additionalProperties: false
                properties:
                  role_ids:
                    type: array
                    items:
                      $ref: "#/components/schemas/UUIDv7"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          description: Missing, invalid, or concurrently revoked browser session
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /apps/catalog:
    get:
      operationId: listAppCatalog
      summary: List server-canonical app descriptors
      security:
        - sumiSession: []
      responses:
        "200":
          description: Available app descriptors
          content:
            application/json:
              schema:
                type: object
                required: [apps]
                additionalProperties: false
                properties:
                  apps:
                    type: array
                    items:
                      $ref: "#/components/schemas/AppDescriptor"
        "401":
          description: Missing or invalid browser session
  /app-installations:
    get:
      operationId: listAppInstallations
      summary: List app lifecycle state for one owner
      security:
        - sumiSession: []
      parameters:
        - $ref: "#/components/parameters/AppOwnerKind"
        - name: owner_id
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/UUIDv7"
        - name: participant_kind
          in: query
          required: false
          description: Required exactly when owner_kind is participant
          schema:
            type: string
            enum: [human, personality_agent]
      responses:
        "200":
          description: App installations
          content:
            application/json:
              schema:
                type: object
                required: [installations]
                additionalProperties: false
                properties:
                  installations:
                    type: array
                    items:
                      $ref: "#/components/schemas/AppInstallation"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          description: Missing or invalid browser session
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: installApp
      summary: Install and enable an app for one owner
      security:
        - sumiSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [owner, app_id]
              additionalProperties: false
              properties:
                owner:
                  $ref: "#/components/schemas/AppOwnerRef"
                app_id:
                  $ref: "#/components/schemas/AppId"
      responses:
        "201":
          description: Installed app
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppInstallation"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          description: Missing, invalid, or concurrently revoked browser session
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /app-installations/{installation_id}/state:
    parameters:
      - name: installation_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/UUIDv7"
    put:
      operationId: setAppInstallationState
      summary: Enable or disable an installed app without deleting app-owned data
      security:
        - sumiSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              additionalProperties: false
              properties:
                state:
                  $ref: "#/components/schemas/AppInstallationState"
      responses:
        "200":
          description: Updated installation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppInstallation"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          description: Missing, invalid, or concurrently revoked browser session
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /app-installations/{installation_id}:
    parameters:
      - name: installation_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/UUIDv7"
    delete:
      operationId: uninstallApp
      summary: Remove only the app-owner binding; app-owned data is not cascaded
      security:
        - sumiSession: []
      responses:
        "204":
          description: Installation removed
        "401":
          description: Missing, invalid, or concurrently revoked browser session
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /direct-chat/commands:
    post:
      operationId: createDirectChatCommand
      summary: Create a direct-chat user command
      description: |
        Admits content from the authenticated direct-chat browser session. The
        signed HttpOnly `sumi_session` cookie supplies the target personality
        agent and human provenance; neither is accepted from the browser body.
        The request Origin must exactly match the configured browser origin
        allowlist. Origin rejection occurs before session or body processing;
        all rejections occur before command_id or seq allocation.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 1024
      security:
        - sumiSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DirectChatUserMessageCommand"
      responses:
        "201":
          description: Target-free command receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectChatCommandReceipt"
        "400":
          description: Command rejected before seq/command_id allocation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectChatCommandRejectedResponse"
        "409":
          description: Idempotency key was already used for different content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectChatCommandIdempotencyConflictResponse"
        "401":
          description: Missing or invalid browser session cookie
        "403":
          description: Origin not allowed
  /direct-chat/ws:
    get:
      operationId: browserWebSocket
      summary: Browser-facing WebSocket
      description: |
        Upgrades to a WebSocket for browser clients. After the handshake the
        client sends `BrowserClientFrame` messages and the server pushes
        `BrowserServerFrame` messages. The caller is authenticated by the signed
        HttpOnly `sumi_session` browser cookie.
      security:
        - sumiSession: []
      requestBody:
        description: The first WebSocket frame (BrowserHello)
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrowserClientFrame"
      responses:
        "101":
          description: WebSocket upgrade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserServerFrame"
        "401":
          description: Missing or invalid browser session cookie
        "403":
          description: Origin not allowed
  /agent/ws:
    get:
      operationId: agentWebSocket
      summary: Agent-facing WebSocket
      description: |
        Upgrades to a WebSocket for agent workers. After the handshake the agent
        sends `AgentHello` followed by `OutboundFrame` messages, and the server
        replies with `ApiHello` followed by `CommandEnvelope` messages. The
        caller is authenticated by a short-lived `Authorization: Bearer` token.
      security:
        - bearerAuth: []
      requestBody:
        description: The first WebSocket frame (AgentHello)
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentHello"
      responses:
        "101":
          description: WebSocket upgrade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiHello"
        "401":
          description: Missing or invalid agent token
        "403":
          description: Origin not allowed
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Short-lived HMAC-SHA256 agent token.
    sumiSession:
      type: apiKey
      in: cookie
      name: sumi_session
      description: Signed HttpOnly browser session cookie.
  parameters:
    WorkspaceId:
      name: workspace_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUIDv7"
    WorkspaceMemberId:
      name: workspace_member_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUIDv7"
    RoleId:
      name: role_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUIDv7"
    AppOwnerKind:
      name: owner_kind
      in: query
      required: true
      schema:
        $ref: "#/components/schemas/AppOwnerKind"
  responses:
    InvalidRequest:
      description: Strict JSON or domain validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    Forbidden:
      description: Authenticated actor lacks current domain authority
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    NotFound:
      description: Resource is absent, unavailable, or intentionally hidden from this actor
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    Conflict:
      description: Requested state conflicts with current canonical state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
  schemas:
    UUIDv7:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    APIError:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: string
          enum: [invalid_request, invalid_session, missing_session, duplicate_session_cookies, origin_not_allowed, forbidden, not_found, conflict, internal_error]
    Workspace:
      type: object
      required: [workspace_id, name, owner_workspace_member_id, created_at]
      additionalProperties: false
      properties:
        workspace_id:
          $ref: "#/components/schemas/UUIDv7"
        name:
          type: string
          minLength: 1
          maxLength: 200
        owner_workspace_member_id:
          $ref: "#/components/schemas/UUIDv7"
        created_at:
          type: string
          format: date-time
    WorkspaceCreateRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
    WorkspaceUpdateRequest:
      $ref: "#/components/schemas/WorkspaceCreateRequest"
    ParticipantRef:
      oneOf:
        - type: object
          required: [kind, human_id]
          additionalProperties: false
          properties:
            kind:
              const: human
            human_id:
              $ref: "#/components/schemas/UUIDv7"
        - type: object
          required: [kind, personality_agent_id]
          additionalProperties: false
          properties:
            kind:
              const: personality_agent
            personality_agent_id:
              $ref: "#/components/schemas/PersonalityAgentId"
      discriminator:
        propertyName: kind
    WorkspaceMembership:
      type: object
      required: [workspace_member_id, workspace_id, participant, owner, role_ids, joined_at, left_at]
      additionalProperties: false
      properties:
        workspace_member_id:
          $ref: "#/components/schemas/UUIDv7"
        workspace_id:
          $ref: "#/components/schemas/UUIDv7"
        participant:
          $ref: "#/components/schemas/ParticipantRef"
        owner:
          type: boolean
        role_ids:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/UUIDv7"
        joined_at:
          type: string
          format: date-time
        left_at:
          description: Null while this exact membership tenure is active; replay never reopens a closed tenure.
          oneOf:
            - type: string
              format: date-time
            - type: "null"
    WorkspaceInvite:
      type: object
      required: [invite_id, workspace_id, code, expires_at, created_at]
      additionalProperties: false
      properties:
        invite_id:
          $ref: "#/components/schemas/UUIDv7"
        workspace_id:
          $ref: "#/components/schemas/UUIDv7"
        code:
          type: string
          minLength: 43
          maxLength: 43
          description: Opaque single-use secret returned only at creation
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    WorkspaceInvitePreview:
      type: object
      required: [workspace_id, workspace_name, expires_at]
      additionalProperties: false
      properties:
        workspace_id:
          $ref: "#/components/schemas/UUIDv7"
        workspace_name:
          type: string
          minLength: 1
          maxLength: 200
        expires_at:
          type: string
          format: date-time
    WorkspacePermission:
      type: string
      enum: [manage_workspace, manage_members, manage_roles, manage_apps, manage_channels, mention_all]
    WorkspaceRoleMutation:
      type: object
      required: [name, permissions]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        color:
          type: string
          pattern: '^#[0-9a-f]{6}$'
        position:
          type: integer
          minimum: 0
          maximum: 1000000
          description: Optional ordering hint. Higher roles render first; omission preserves the stored value on update and uses zero on create.
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/WorkspacePermission"
    WorkspaceRole:
      type: object
      required: [role_id, workspace_id, name, position, permissions, created_at]
      additionalProperties: false
      properties:
        role_id:
          $ref: "#/components/schemas/UUIDv7"
        workspace_id:
          $ref: "#/components/schemas/UUIDv7"
        name:
          type: string
          minLength: 1
          maxLength: 60
        color:
          type: string
          pattern: '^#[0-9a-f]{6}$'
        position:
          type: integer
          minimum: 0
          maximum: 1000000
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/WorkspacePermission"
        created_at:
          type: string
          format: date-time
    AppId:
      type: string
      pattern: '^[a-z][a-z0-9-]{0,63}$'
    AppOwnerKind:
      type: string
      enum: [workspace, participant]
    AppOwnerRef:
      oneOf:
        - type: object
          required: [kind, workspace_id]
          additionalProperties: false
          properties:
            kind:
              const: workspace
            workspace_id:
              $ref: "#/components/schemas/UUIDv7"
        - type: object
          required: [kind, participant]
          additionalProperties: false
          properties:
            kind:
              const: participant
            participant:
              $ref: "#/components/schemas/ParticipantRef"
      discriminator:
        propertyName: kind
    AppDescriptor:
      type: object
      required: [app_id, display_name, workspace_owner_allowed, participant_owner_allowed]
      additionalProperties: false
      properties:
        app_id:
          $ref: "#/components/schemas/AppId"
        display_name:
          type: string
          minLength: 1
          maxLength: 100
        workspace_owner_allowed:
          type: boolean
        participant_owner_allowed:
          type: boolean
    AppInstallationState:
      type: string
      enum: [enabled, disabled]
    AppInstallation:
      type: object
      required: [installation_id, owner, app_id, state, installed_at, updated_at]
      additionalProperties: false
      properties:
        installation_id:
          $ref: "#/components/schemas/UUIDv7"
        owner:
          $ref: "#/components/schemas/AppOwnerRef"
        app_id:
          $ref: "#/components/schemas/AppId"
        state:
          $ref: "#/components/schemas/AppInstallationState"
        installed_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    JsonSafeInteger:
      type: integer
      minimum: 0
      maximum: 9007199254740991
      description: non-negative integer representable exactly by JavaScript number clients
    ProcessGeneration:
      type: string
      pattern: '^(?:0|[1-9][0-9]{0,17}|[1-8][0-9]{18}|9[01][0-9]{17}|92[01][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[01][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-7])$'
      format: canonical-process-generation
      description: canonical decimal process generation in 0..=9223372036854775807; encoded as a string to preserve it losslessly in JavaScript
    CanonicalDecimalU64:
      type: string
      pattern: '^(?:0|[1-9][0-9]{0,18}|1[0-7][0-9]{18}|18[0-3][0-9]{17}|184[0-3][0-9]{16}|1844[0-5][0-9]{15}|18446[0-6][0-9]{14}|184467[0-3][0-9]{13}|1844674[0-3][0-9]{12}|184467440[0-6][0-9]{10}|1844674407[0-2][0-9]{9}|18446744073[0-6][0-9]{8}|1844674407370[0-8][0-9]{6}|18446744073709[0-4][0-9]{5}|184467440737095[0-4][0-9]{4}|18446744073709550[0-9]{3}|18446744073709551[0-5][0-9]{2}|1844674407370955160[0-9]|1844674407370955161[0-5])$'
      format: canonical-decimal-u64
      description: canonical decimal u64 encoded as a string to preserve it losslessly in JavaScript
    CommandEnvelope:
      $ref: "./agent-events.yaml#/$defs/CommandEnvelope"
    PersonalityAgentId:
      $ref: "./agent-events.yaml#/$defs/PersonalityAgentId"
    DirectChatProvenanceV1:
      $ref: "./agent-events.yaml#/$defs/DirectChatProvenanceV1"
    AgentHello:
      $ref: "./agent-events.yaml#/$defs/AgentHello"
    ApiHello:
      $ref: "./agent-events.yaml#/$defs/ApiHello"
    OutboundFrame:
      $ref: "./agent-events.yaml#/$defs/OutboundFrame"
    BrowserClientFrame:
      $ref: "./agent-events.yaml#/$defs/BrowserClientFrame"
    BrowserServerFrame:
      $ref: "./agent-events.yaml#/$defs/BrowserServerFrame"
    DirectChatUserMessageCommand:
      type: object
      required: [type, text, attachments]
      additionalProperties: false
      properties:
        type:
          const: user_message
        text:
          type: string
        attachments:
          type: array
          maxItems: 0
          items:
            $ref: "./agent-events.yaml#/$defs/Attachment"
    DirectChatCommandReceipt:
      type: object
      required: [idempotency_key, command_id, seq]
      additionalProperties: false
      properties:
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 1024
        command_id:
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        seq:
          $ref: "#/components/schemas/JsonSafeInteger"
    DirectChatCommandRejectedResponse:
      type: object
      required: [error, reject_reason]
      additionalProperties: false
      properties:
        error:
          const: invalid_command
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 1024
        reject_reason:
          type: string
          enum: [unknown_command, schema_violation, attachments_not_empty, oversized, not_allowed]
    DirectChatCommandIdempotencyConflictResponse:
      type: object
      required: [error, idempotency_key, reject_reason]
      additionalProperties: false
      properties:
        error:
          const: idempotency_conflict
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 1024
        reject_reason:
          const: idempotency_conflict
