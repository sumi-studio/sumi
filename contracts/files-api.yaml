openapi: 3.1.0
info:
  title: Sumi Files API (fabric-cloud prototype)
  version: 0.1.0
  description: >-
    Scoped file API over one canonical POSIX namespace. Implemented by
    apps/files (filesvc). Auth is bearer token -> scope grants; each scope is
    an isolated subtree root/<scope>/. Mutations take an If-Version header:
    "any" (unconditional), "none" (create-only; 409 if the path exists or has
    a service version), or an integer (CAS against the last service-minted
    version). Versions are minted from one global monotonic sequence — a
    version value is unique across paths and time, so a stale CAS token can
    never match a different object that later occupies the same path (no
    ABA across rename-overwrite or delete/recreate). Service versions are
    cooperative among API writers; direct executor/POSIX writes bypass them
    and are reported via external_change.
    Durability: every mutation declares an intent row (with a pre-minted
    version and the declaring instance's owner id) before touching the
    filesystem, then applies version rows and the journal event after the
    fs commit. A DB failure between fs commit and apply leaves a
    recoverable intent, never silent divergence: the reconciler re-checks
    the disk and rolls the DB forward or drops the intent, including after
    a restart. A filesystem call that outlives the request deadline is
    still settled by its own goroutine — intents are never dropped on a
    timer guess. Errors after a possibly-committed fs mutation are
    surfaced, never reported as success. All mutations in one scope
    serialize, so a directory rename cannot interleave with a concurrent
    write's row bookkeeping. Store faults (deadline, dropped connection,
    network error) are 503 store_unavailable on every op — never
    version:0 or external_change:false.
    Ownership: one database serves exactly one canonical root, enforced at
    startup by store_meta.root_id binding plus a session-scoped advisory
    lock — at most one live writer per database. A second instance waits
    briefly for a rolling-restart handoff, then refuses to start; a
    different root on an occupied database is rejected outright. If the
    lock session dies the store is deposed (mutations fail fast with 503,
    and /healthz reports 503 so supervision sees the fenced state); it
    resumes only if it re-acquires while still the recorded owner. The
    re-acquire loop reads store_meta.owner directly, so a live successor
    displacing it is detected without waiting for the lock — the
    displaced process exits rather than lingering as a zombie. A dead
    recorded owner can be taken over; a temporary DB loss with no
    successor recovers in place.
    Settlement honesty: while any intent overlapping the target paths is
    unsettled, a conflicting mutation is refused with 503
    pending_settlement — the outcome of the earlier filesystem work is
    uncertain, and new rows minted inside its subtree could be stranded
    by a late-landing rename. The refusal is path-local: disjoint
    operations proceed normally, and intents whose destination leg is
    empty never match unrelated paths. The error message carries the
    blocking intent's recorded cause when the filesystem could not be
    observed at all. Intents are only settled by the instance
    that declared them (its fs goroutine) or — after the settle grace —
    by the live owner. The grace is measured from intent declare time
    and covers in-kernel/daemon-accepted completion after owner death;
    it is a best-effort bound, not proof that a partitioned-but-alive
    owner's syscall can never land late.
    Every settlement path (apply AND intent/row resolution) verifies the
    recorded store owner inside its transaction, so a displaced process
    cannot delete rows a live successor would roll forward.
    Verdict classes: only ENOENT and ENOTDIR count as observed absence —
    a path addressed through a non-directory provably does not exist as
    addressed. Every other stat failure (EACCES, EIO, ENOTCONN, a dead
    FUSE mount) is unverifiable: the intent stays pending indefinitely
    with its cause recorded (stalled), keeps excluding conflicting ops
    on that path, and is never resolved by a timer. Restoring filesystem
    observability lets the next pass settle it truthfully. A removal
    settled by observed absence cleans the dead version rows but journals
    NO remove event — observed absence is not a performed removal, and
    the event log must not invent who removed the file.
    Every filesystem observation the reconciler makes — including
    "absent" — is bound to a single root descriptor pinned for the whole
    pass. Under REQUIRE_MOUNT the descriptor's own mount identity is
    verified (statx MNT_ID on the opened fd, then mountinfo + cache
    policy read beneath the fd), so an unmount mid-pass answers
    "unverifiable" (ENOTCONN on the dead mount) instead of "absent" on
    the bare directory the mountpoint leaves behind — acknowledged rows
    and pending intents are never deleted on an observation the pass
    cannot trust.
    fs commit vs reply: mutation syscalls report whether their commit
    point was reached separately from the error. A publish that
    succeeded followed by a failed trailing stat is "landed but
    unobserved" — the intent is kept for reconciliation, never dropped
    as a rejection; an ambiguous transport-class error is likewise kept,
    because on FUSE a lost reply can follow an applied request. Only a
    definitive pre-commit rejection (absent source, kind mismatch,
    permission, conflict) drops an intent outright.
    Rename settlement proves the destination IS the moved source, never
    that it merely exists: the recorded source kind must match, the
    inode must be continuous, and then — for files — the recorded
    content hash must equal the destination's bytes (inode numbers are
    recycled by delete+create, and preserved timestamps are forgeable);
    for directories, at least one recorded member's full fingerprint —
    including ctime, which copy/restore cannot preserve — must appear at
    the corresponding destination path and no sampled member may
    contradict. A directory with no recorded members to corroborate is
    unproven. An unproven destination is never claimed: the intent is
    resolved, every version row is kept, and no rename event is
    journaled — foreign bytes are never laundered into the service's
    audit trail. Hash equality alone is never used to invent a rename:
    two independently created files with identical bytes produce an
    unproven outcome, not an adoption.
    Late landings: a resolved intent keeps its evidence (pre-state
    fingerprint, expected hash, source kind) as a tombstone for a
    retention horizon; every pass re-judges tombstones and can still
    apply a provably-landed effect — including moving rows minted after
    the drop whose recorded fingerprints prove a late rename physically
    carried them. This retention is an evidence horizon, not a
    quiescence proof: a filesystem effect landing after the horizon
    cannot be re-judged (no evidence remains), and a successor op
    admitted after the exclusion window that minted rows under the old
    subtree can still be stranded with its version at the old path —
    reported honestly as external_change/404-at-recorded-path, never as
    a clean record.
    Dead-owner intents are settled by
    the live reconciler after the settle grace; settlement claims the
    intent atomically and write intents verify the landed bytes' hash, so
    externally modified content is recorded as diverged
    (external_change=true), never laundered into the service's version.
    external_change is a comparison against a recorded version: a path
    never written through the API reports version 0, not
    external_change — the service cannot detect edits it never recorded.
    mkdir is deliberately idempotent create-parents: mkdir over an
    existing directory succeeds and mints a version.
    Scope names must be real directories under the root — a scope name
    that is a symlink is refused (400 wrong_kind), because a scope-root
    alias would grant one scope's tokens access to another scope's files.
    Ordinary
    symlinks inside a scope remain supported (in-scope links resolve;
    escaping ones are 403 escape_denied).
    Deployment requirement: the canonical mount the service roots on MUST
    run with zero client-side metadata caching (JuiceFS:
    --attr-cache=0 --entry-cache=0 --dir-entry-cache=0). A nonzero attr
    cache lets a conditional write stat a stale fingerprint and silently
    overwrite a direct writer's edit made inside the cache window.
    FILESV_REQUIRE_MOUNT=1 enforces this at runtime: every file op is
    refused with 503 mount_unavailable while the root is not a mountpoint,
    and 503 mount_policy when the mount cannot prove zero metadata
    caching (JuiceFS /.config timeouts nonzero or unverifiable FUSE fs).
    The check runs on every request: statx(STATX_MNT_ID) identifies the
    mount the path actually resolves to (correct under mount stacking and
    MOVE_MOUNT_BENEATH), the mount must be mounted at that path and at the
    JuiceFS root "/" — subdirectory binds are refused because their .config
    is a regular file, not daemon metadata. The /.config read is also
    pinned to the verified mount: statx MNT_ID must match the root's, so a
    file bind-mounted over it cannot forge zero timeouts. Requires kernel
    >= 5.8 for STATX_MNT_ID; when the kernel cannot identify the mount the
    gate fails closed with mount_unavailable. A known allowlist of
    kernel-coherent local filesystems (ext4, xfs, tmpfs, ...) passes;
    other FUSE and network filesystems are refused. REQUIRE_MOUNT=0
    disables the gate for simple local operation.
    Operation boundary: every path operation is resolved in-kernel beneath
    a pinned scope directory descriptor (openat2 RESOLVE_BENEATH, Linux
    >= 5.6). A directory<->symlink swap racing a request cannot redirect
    it outside the scope — the kernel re-resolves every component at use
    time and fails closed with 403 escape_denied. A swap can still change
    which in-scope object an op targets (ordinary concurrent-modification
    semantics), but never escapes the scope root. Paths containing ".."
    and absolute escapes remain refused; only single-scope namespaces are
    reachable. Caller-supplied paths are canonicalized at the API
    boundary — "./x", "/x", and "a//b" all name the same logical path for
    version rows, pending-intent exclusion, and filesystem resolution,
    so spelling variants can neither split identity nor bypass
    settlement. Reads serve regular files only: special files (fifo,
    socket, device) stat as kind=special and read as 400 wrong_kind —
    the open is non-blocking, so a FIFO can never wedge a handler.
paths:
  /v1/files/{scope}/stat:
    get:
      operationId: fileStat
      parameters:
        - { name: scope, in: path, required: true, schema: { type: string } }
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: kind, size, mtime_ns, version, fingerprint, external_change
        '403': { description: No grant for scope, or path escapes scope }
        '404': { description: Path not found }
        '503': { description: mount_unavailable | store_unavailable | pending_settlement | unavailable }
  /v1/files/{scope}/list:
    get:
      operationId: fileList
      parameters:
        - { name: scope, in: path, required: true, schema: { type: string } }
        - { name: path, in: query, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, maximum: 1000 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200': { description: entries[] (name, kind, size, mtime_ns), next_cursor }
        '400': { description: Path is not a directory }
        '404': { description: Path not found }
  /v1/files/{scope}/read:
    get:
      operationId: fileRead
      parameters:
        - { name: scope, in: path, required: true, schema: { type: string } }
        - { name: path, in: query, required: true, schema: { type: string } }
        - { name: offset, in: query, schema: { type: integer } }
        - { name: len, in: query, schema: { type: integer } }
      responses:
        '200':
          description: >-
            File bytes. X-File-Version carries the last service-minted
            version; X-External-Change: true marks content changed outside
            the API since that version.
        '400': { description: wrong_kind (directory or special file) }
        '404': { description: Path not found }
        '503': { description: mount_unavailable | store_unavailable | pending_settlement | unavailable }
  /v1/files/{scope}/write:
    put:
      operationId: fileWrite
      parameters:
        - { name: scope, in: path, required: true, schema: { type: string } }
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: '{ "version": n }' }
        '409': { description: version_conflict }
        '413': { description: Body exceeds the 256 MiB service ceiling }
        '503': { description: mount_unavailable | store_unavailable | pending_settlement | unavailable }
  /v1/files/{scope}/rename:
    post:
      operationId: fileRename
      description: >-
        JSON body { "from": "...", "to": "...", "if_version": any|none|n }.
        Atomic within the same scope (kernel renameat2 beneath the pinned
        scope descriptor). A directory may rename over an EMPTY directory;
        file-over-dir and dir-over-file are 400 wrong_kind; dir over a
        non-empty dir is 409 dir_not_empty; if_version "none" makes the
        destination check atomic (RENAME_NOREPLACE -> 409 external_change/
        version_conflict). The destination is minted a fresh global-sequence
        version (never a reused value) and descendant version rows move
        with the subtree. A rename refused before the fs commit leaves
        both sides untouched; one that fails after the fs commit is
        reconciled from disk state (see Durability).
      responses:
        '200': { description: '{ "version": n }' }
        '400': { description: wrong_kind on file/dir kind mismatch }
        '404': { description: Source not found }
        '409': { description: version_conflict | dir_not_empty | external_change }
        '503': { description: mount_unavailable | store_unavailable | pending_settlement | unavailable }
  /v1/files/{scope}/mkdir:
    post:
      operationId: fileMkdir
      description: 'JSON body { "path": "..." }; creates parents.'
      responses:
        '200': { description: '{ "version": n }' }
  /v1/files/{scope}/remove:
    delete:
      operationId: fileRemove
      parameters:
        - { name: scope, in: path, required: true, schema: { type: string } }
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: '{ "removed": true }' }
        '404': { description: Path not found }
        '409': { description: version_conflict }
        '503': { description: mount_unavailable | store_unavailable | pending_settlement | unavailable }
  /v1/files/{scope}/changes:
    get:
      operationId: fileChanges
      description: >-
        Service-minted mutation journal (seq, op, path, version, at). Only
        API-mediated mutations are journaled; direct executor writes are not.
      parameters:
        - { name: scope, in: path, required: true, schema: { type: string } }
        - { name: since, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, maximum: 5000 } }
      responses:
        '200': { description: events[] ordered by seq }
components:
  securitySchemes:
    bearerScope:
      type: http
      scheme: bearer
security:
  - bearerScope: []
