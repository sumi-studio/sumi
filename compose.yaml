name: sumi

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sumi
      POSTGRES_USER: sumi
      POSTGRES_PASSWORD: ${SUMI_POSTGRES_PASSWORD:?run scripts/dev/create-compose-env.sh first}
    ports:
      - "127.0.0.1:${SUMI_POSTGRES_PORT:-55432}:5432"
    volumes:
      - sumi-postgres:/var/lib/postgresql/data
      - ./apps/api/dev/postgres/001_users.sql:/docker-entrypoint-initdb.d/001_users.sql:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sumi -d sumi"]
      interval: 2s
      timeout: 3s
      retries: 30
    shm_size: 128mb

  api-migrate:
    image: sumi-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["/usr/local/bin/sumi-migrate"]
    environment:
      SUMI_DATABASE_URL: postgres://sumi:${SUMI_POSTGRES_PASSWORD}@postgres:5432/sumi?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: sumi-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8080"
      SUMI_DATABASE_URL: postgres://sumi:${SUMI_POSTGRES_PASSWORD}@postgres:5432/sumi?sslmode=disable
      SUMI_DEFAULT_TIMEZONE: ${SUMI_DEFAULT_TIMEZONE:-Asia/Tokyo}
      SUMI_BROWSER_SESSION_SECRET: ${SUMI_BROWSER_SESSION_SECRET:?run scripts/dev/create-compose-env.sh first}
      SUMI_BROWSER_SESSION_AUDIENCE: sumi:web:conversation
      SUMI_ENABLE_DEV_SESSION: "true"
      SUMI_DEV_SESSION_USER_ID: 019c0000-0000-7000-8000-000000000001
      SUMI_COMMAND_LOG_DIR: /var/lib/sumi/command-log
      SUMI_AGENT_RUNTIME_STATE_DIR: /var/lib/sumi/agent-runtime
      SUMI_AGENT_WS_ALLOWED_ORIGINS: ${SUMI_AGENT_WS_ALLOWED_ORIGINS:-}
      SUMI_BROWSER_WS_ALLOWED_ORIGINS: ${SUMI_BROWSER_WS_ALLOWED_ORIGINS:-}
    volumes:
      - sumi-api-state:/var/lib/sumi
    depends_on:
      api-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 3s
      timeout: 3s
      retries: 30
    read_only: true
    tmpfs:
      - /tmp

  web:
    image: sumi-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "${SUMI_HTTP_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/_web/health"]
      interval: 3s
      timeout: 3s
      retries: 30
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run

volumes:
  sumi-postgres:
  sumi-api-state:
