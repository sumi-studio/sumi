# Prepare-only workspace override: bind the secretary's canonical files scope
# as /workspace for the prepare role. The supervisor adds this file to the
# prepare graph when files scope mode is configured (SUMI_FILES_MOUNTPOINT,
# SUMI_FILES_VOLUME_UUID, SUMI_FILES_CHECK); it is never used standalone.
#
# The full agent graph takes deploy/files/compose.executor-workspace.yaml
# instead, which additionally binds the scope for the executor service.
# Keeping a separate prepare-only file matters: the prepare graph has no
# executor service, and a shared override that declares one would add an
# unconfigured executor service to `prepare` runs.
#
# create_host_path: false keeps a missing scope directory a hard failure
# instead of Docker silently creating a host-local workspace copy.
services:
  prepare:
    # The volume UUID the workspace bind was created under is immutable
    # container metadata: inspect-epoch reads it to establish which volume
    # this epoch was launched against. A later mount-path or configuration
    # change cannot rewrite it — the label is the epoch's own claim.
    labels:
      ai.sumi.files-volume-uuid: ${SUMI_FILES_VOLUME_UUID:?run sumi-files-check first}
    volumes:
      - type: bind
        source: ${SUMI_FILES_SCOPE_DIR:?run sumi-files-check and set SUMI_FILES_SCOPE_DIR}
        target: /workspace
        bind:
          create_host_path: false
