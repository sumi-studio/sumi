# Replace the executor's host-local `workspace` volume with the secretary's
# scope directory on the canonical files volume. Use together with
# deploy/agent/compose.yaml; Compose merges volume entries by target path.
#
#   dir=$(sumi-files-check /var/lib/sumi-files/mnt "$SUMI_FILES_VOLUME_UUID" "$SCOPE") &&
#     SUMI_FILES_SCOPE_DIR="$dir" docker compose \
#       -f deploy/agent/compose.yaml -f deploy/files/compose.executor-workspace.yaml up -d
#
# The host's JuiceFS client must run as root (it adds allow_other), so the
# Docker daemon and uid 10002 can reach the mount. The container receives
# only this one directory — no metadata or object-storage credential and no
# other scope. If the host's JuiceFS client restarts, the bind held by a
# running executor answers ENOTCONN: restart the executor after
# sumi-files-check passes again (sumi-files-executor@.service does this).
services:
  prepare:
    volumes:
      - type: bind
        source: ${SUMI_FILES_SCOPE_DIR:?run sumi-files-check and set SUMI_FILES_SCOPE_DIR}
        target: /workspace
        bind:
          create_host_path: false
  executor:
    volumes:
      - type: bind
        source: ${SUMI_FILES_SCOPE_DIR:?run sumi-files-check and set SUMI_FILES_SCOPE_DIR}
        target: /workspace
        read_only: false
        bind:
          create_host_path: false
