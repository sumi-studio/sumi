# Canonical files mount for isolated Core jobs and terminals.
# The root provisioner verifies the live volume and persona scope before every launch.
services:
  runtime-provisioner:
    environment:
      SUMI_FILES_MOUNTPOINT: /var/lib/sumi-files/mnt
      SUMI_FILES_VOLUME_UUID: ${SUMI_FILES_VOLUME_UUID:?set to the volume UUID printed by sumi-files-format}
      SUMI_FILES_CHECK: /opt/sumi/deploy/files/sumi-files-check
      SUMI_FILES_CHECK_WAIT_SECONDS: ${SUMI_FILES_CHECK_WAIT_SECONDS:-30}
    volumes:
      - type: bind
        source: /var/lib/sumi-files
        target: /var/lib/sumi-files
        bind:
          propagation: rslave
          create_host_path: false
