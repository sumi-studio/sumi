# Installed as /etc/tmpfiles.d/sumi-dogfood.conf on the dedicated origin.
# These paths are ephemeral control sockets/secrets, not the persistent state.
d /run/sumi                       0755 root  root  -
d /run/sumi/local-control         0750 65532 20000 -
d /run/sumi/runtime-secrets       0700 root  root  -
d /run/sumi/runtime-provisioner   0750 root  20000 -
d /run/sumi/supervisor-locks      0700 root  root  -
