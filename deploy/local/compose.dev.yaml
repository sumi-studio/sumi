# Local full-stack compose: Postgres + Go API + Vite web + containerized agent
# (runtime/executor/broker) in one command.
#
# Usage:
#   scripts/dev/compose-stack up
#   scripts/dev/compose-stack down
#
# The web and agent runtime share the API's network namespace so they can reach
# the loopback public endpoint. Local control, executor, and broker traffic use
# private Unix-socket volumes; executor and broker remain network_mode=none.

name: sumi-dev

services:
  firebase-auth:
    build:
      context: ../..
      dockerfile: deploy/firebase/Dockerfile
    environment:
      FIREBASE_PROJECT_ID: ${SUMI_AUTH_FIREBASE_PROJECT_ID:-sumi-studio}
      FIREBASE_AUTH_EXPORT_DIR: /var/lib/firebase/auth
    ports:
      - "${SUMI_DEV_BIND_HOST:-127.0.0.1}:9099:9099"
    volumes:
      - firebase-auth-data:/var/lib/firebase
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const net=require('node:net');
          const socket=net.connect(9099,'127.0.0.1',()=>{socket.end();process.exit(0)});
          socket.on('error',()=>process.exit(1));
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 5s
    stop_signal: SIGINT
    stop_grace_period: 30s
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sumi
      POSTGRES_PASSWORD: sumi-dev
      POSTGRES_DB: sumi
    # No host port is published; the API reaches postgres by hostname.
    volumes:
      - sumi-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sumi -d sumi"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 2s
    restart: "no"

  migrate:
    build:
      context: ../..
      dockerfile: deploy/api/Dockerfile
    # The image's ENTRYPOINT is sumi-api; override it to run the migrate binary.
    entrypoint: ["/usr/local/bin/sumi-migrate"]
    command: []
    environment:
      SUMI_DB_URL: ${SUMI_DB_URL:-postgres://sumi:sumi-dev@postgres:5432/sumi?sslmode=disable}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Prepare API state and local-control socket directories with the exact
  # ownership and modes the server expects.
  api-state-init:
    build:
      context: ../..
      dockerfile: deploy/api/Dockerfile
    user: "0:0"
    entrypoint: ["/busybox/sh"]
    command:
      - "-c"
      - |
        install -d -m 0700 -o 65532 -g 65532 /var/lib/sumi-command-log
        install -d -m 0700 -o 65532 -g 65532 /var/lib/sumi-runtime-state
        install -d -m 0750 -o 65532 -g 10001 /run/sumi/local-control
    cap_add: [CHOWN, FOWNER]
    volumes:
      - api-command-log:/var/lib/sumi-command-log
      - api-runtime-state:/var/lib/sumi-runtime-state
      - local-control:/run/sumi/local-control
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: deploy/api/Dockerfile
    user: "65532:10001"
    group_add:
      - "10001"
    cap_drop: [ALL]
    cap_add: [CHOWN]
    # The image's ENTRYPOINT is sumi-api; override it so we can source the
    # runtime identity (written by agent-allocator) and start the API with the
    # matching personality agent ID and boot nonce.
    entrypoint: ["/busybox/sh"]
    command:
      - "-c"
      - |
        identity=/run/sumi-identity/identity.env
        [ -f "$$identity" ] || { echo "runtime identity not available" >&2; exit 1; }
        while IFS='=' read -r key value; do
          case "$$key" in
            SUMI_PERSONALITY_AGENT_ID) SUMI_PERSONALITY_AGENT_ID="$$value" ;;
            SUMI_RPC_GENERATION) SUMI_RPC_GENERATION="$$value" ;;
            SUMI_RPC_NONCE) SUMI_RPC_NONCE="$$value" ;;
          esac
        done < "$$identity"
        [ -n "$$SUMI_PERSONALITY_AGENT_ID" ] || { echo "missing identity PAID" >&2; exit 1; }
        [ -n "$$SUMI_RPC_NONCE" ] || { echo "missing identity nonce" >&2; exit 1; }
        [ -n "$$SUMI_RPC_GENERATION" ] || { echo "missing identity generation" >&2; exit 1; }
        export SUMI_LOCAL_CONTROL_PERSONALITY_AGENT_ID="$$SUMI_PERSONALITY_AGENT_ID"
        export SUMI_LOCAL_CONTROL_RPC_BOOT_NONCE="$$SUMI_RPC_NONCE"
        export SUMI_LOCAL_CONTROL_GENERATION="$$SUMI_RPC_GENERATION"
        exec /usr/local/bin/sumi-api
    environment:
      SUMI_DB_URL: ${SUMI_DB_URL:-postgres://sumi:sumi-dev@postgres:5432/sumi?sslmode=disable}
      SUMI_COMMAND_LOG_DIR: /var/lib/sumi-command-log
      SUMI_AGENT_RUNTIME_STATE_DIR: /var/lib/sumi-runtime-state
      SUMI_AGENT_TOKEN_SECRET: ${SUMI_AGENT_TOKEN_SECRET:-}
      SUMI_BROWSER_SESSION_SECRET: ${SUMI_BROWSER_SESSION_SECRET:?SUMI_BROWSER_SESSION_SECRET is required}
      SUMI_BROWSER_SESSION_AUDIENCE: ${SUMI_BROWSER_SESSION_AUDIENCE:-sumi:web:direct-chat}
      SUMI_BROWSER_WS_ALLOWED_ORIGINS: ${SUMI_BROWSER_WS_ALLOWED_ORIGINS:?SUMI_BROWSER_WS_ALLOWED_ORIGINS is required}
      SUMI_AUTH_FIREBASE_PROJECT_ID: ${SUMI_AUTH_FIREBASE_PROJECT_ID:?SUMI_AUTH_FIREBASE_PROJECT_ID is required}
      SUMI_AUTH_FIREBASE_TENANT_ID: ${SUMI_AUTH_FIREBASE_TENANT_ID:-}
      SUMI_AUTH_TENANT_ID: ${SUMI_AUTH_TENANT_ID:-sumi-dev}
      SUMI_AUTH_ALLOW_INSECURE_COOKIES: ${SUMI_AUTH_ALLOW_INSECURE_COOKIES:-true}
      SUMI_AUTH_SESSION_TTL: ${SUMI_AUTH_SESSION_TTL:-1h}
      # API-side traffic stays inside the Compose network. Browsers use the
      # exact published host address configured on the web service below.
      FIREBASE_AUTH_EMULATOR_HOST: firebase-auth:9099
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      SUMI_LOCAL_CONTROL_ENABLED: "1"
      SUMI_LOCAL_CONTROL_UNIX_SOCKET: /run/sumi/local-control/control.sock
      SUMI_LOCAL_CONTROL_SOCKET_GID: "10001"
      SUMI_LOCAL_CONTROL_BEARER: ${SUMI_LOCAL_CONTROL_BEARER:?SUMI_LOCAL_CONTROL_BEARER is required}
      SUMI_LOCAL_CONTROL_TENANT_ID: ${SUMI_LOCAL_CONTROL_TENANT_ID:-sumi-dev}
      SUMI_LOCAL_CONTROL_DELIVERY_AUTHORIZATION: ${SUMI_LOCAL_CONTROL_DELIVERY_AUTHORIZATION:-raw}
      SUMI_AGENT_WRAPPING_KEY_ID: ${SUMI_AGENT_WRAPPING_KEY_ID:-local-ephemeral/v1}
      SUMI_AGENT_WRAPPING_KEY: ${SUMI_AGENT_WRAPPING_KEY:?SUMI_AGENT_WRAPPING_KEY is required}
      SUMI_MODEL_PRESET: ${SUMI_MODEL_PRESET:-kimi-k3}
    ports:
      - "${SUMI_DEV_BIND_HOST:-127.0.0.1}:8080:8080"
      # The web dev server shares this network namespace, so its port is also
      # exposed through the API service's port mappings.
      - "${SUMI_DEV_BIND_HOST:-127.0.0.1}:5173:5173"
    volumes:
      - api-command-log:/var/lib/sumi-command-log
      - api-runtime-state:/var/lib/sumi-runtime-state
      - local-control:/run/sumi/local-control
      # Read the runtime identity written by agent-allocator to pick up the
      # generated boot nonce and generation.
      - agent-runtime-identity:/run/sumi-identity:ro
    depends_on:
      agent-allocator:
        condition: service_completed_successfully
      api-state-init:
        condition: service_completed_successfully
      firebase-auth:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/busybox/wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 5s
    restart: "no"

  web:
    build:
      context: ../..
      dockerfile: deploy/web/Dockerfile
    # Share the API's network namespace so the web dev server can use the
    # loopback public server (127.0.0.1:8080) without exposing the API off-host.
    network_mode: service:api
    environment:
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
      VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
      VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
      VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
      VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
      VITE_FIREBASE_MEASUREMENT_ID: ${VITE_FIREBASE_MEASUREMENT_ID:-}
      VITE_FIREBASE_AUTH_EMULATOR_URL: ${VITE_FIREBASE_AUTH_EMULATOR_URL:?VITE_FIREBASE_AUTH_EMULATOR_URL is required}
      # Vite proxies browser /auth and /direct-chat requests over this private
      # loopback path. The browser itself stays same-origin on port 5173.
      SUMI_DEV_API_ORIGIN: http://127.0.0.1:8080
    # Ports are published through the api service because this container shares
    # the api network namespace.
    depends_on:
      api:
        condition: service_healthy
    restart: "no"

  # The allocator is the only service that can mutate the generation ledger.
  # It distributes role-minimal identity.env files atomically and exits.
  agent-allocator:
    build:
      context: ../..
      dockerfile: deploy/agent/Dockerfile
    user: "0:0"
    command: [allocator]
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    environment:
      SUMI_PERSONALITY_AGENT_ID: ${SUMI_PERSONALITY_AGENT_ID:?SUMI_PERSONALITY_AGENT_ID is required}
      SUMI_ALLOCATOR_TRUST_ROOT: /var/lib/sumi-allocator-root
      SUMI_ALLOCATOR_STATE_DIR: /var/lib/sumi-allocator-root/state
      SUMI_IDENTITY_OUTPUT_ROOT: /var/lib/sumi-allocator-root/identity-output
      SUMI_RUNTIME_IDENTITY_GID: "10001"
      SUMI_EXECUTOR_IDENTITY_GID: "10002"
      SUMI_BROKER_IDENTITY_GID: "10003"
    volumes:
      # Persist the directory identities pinned by the allocator ledger across
      # rebuilds of this one-shot container. Child role volumes remain
      # separately mountable by their least-privilege consumers.
      - agent-allocator-root:/var/lib/sumi-allocator-root
      - agent-allocator-state:/var/lib/sumi-allocator-root/state
      - agent-runtime-identity:/var/lib/sumi-allocator-root/identity-output/runtime
      - agent-executor-identity:/var/lib/sumi-allocator-root/identity-output/executor
      - agent-broker-identity:/var/lib/sumi-allocator-root/identity-output/broker

  agent-prepare:
    build:
      context: ../..
      dockerfile: deploy/agent/Dockerfile
    user: "0:0"
    command: [prepare]
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, FSETID]
    environment:
      SUMI_EXECUTOR_UID: "10001"
    volumes:
      - agent-state:/var/lib/sumi
      - agent-workspace:/workspace
      - agent-artifacts:/var/lib/sumi-artifacts
      - agent-executor-ipc:/run/sumi/executor
      - agent-broker-ipc:/run/sumi/broker
    depends_on:
      agent-allocator:
        condition: service_completed_successfully

  agent-runtime:
    build:
      context: ../..
      dockerfile: deploy/agent/Dockerfile
    user: "10001:10001"
    group_add:
      - "10020"
    command: [runtime]
    # Share the API's network namespace for the loopback gateway. Local control
    # remains on the authenticated Unix-socket volume.
    network_mode: service:api
    environment:
      SUMI_WORKSPACE: /workspace
      SUMI_EXECUTOR_SOCKET: /run/sumi/executor/executor.sock
      SUMI_GATEWAY_URL: ws://127.0.0.1:8080/agent/ws
      SUMI_ALLOW_INSECURE_LOOPBACK_GATEWAY: "true"
      SUMI_LOCAL_CONTROL_UNIX_SOCKET: /run/sumi/local-control/control.sock
      SUMI_LOCAL_CONTROL_SERVER_UID: "65532"
      SUMI_LOCAL_CONTROL_SOCKET_GID: "10001"
      SUMI_LOCAL_CONTROL_BEARER_EXPIRES_AT_UNIX: ${SUMI_LOCAL_CONTROL_BEARER_EXPIRES_AT_UNIX:-4102444800}
      SUMI_AGENT_WRAPPING_KEY_ID: ${SUMI_AGENT_WRAPPING_KEY_ID:-local-ephemeral/v1}
      SUMI_MODEL_PRESET: ${SUMI_MODEL_PRESET:-kimi-k3}
      SUMI_LOG: ${SUMI_LOG:-sumi_agent=info}
    secrets:
      - source: sumi_local_control_bearer
        target: sumi_local_control_bearer
        uid: "10001"
        gid: "10001"
        mode: 0o400
      - source: sumi_agent_wrapping_key
        target: sumi_agent_wrapping_key
        uid: "10001"
        gid: "10001"
        mode: 0o400
      - source: sumi_approval_secret_digest_key
        target: sumi_approval_secret_digest_key
        uid: "10001"
        gid: "10001"
        mode: 0o400
      - source: sumi_provider_api_key
        target: sumi_provider_api_key
        uid: "10001"
        gid: "10001"
        mode: 0o400
    volumes:
      - local-control:/run/sumi/local-control:ro
      - agent-state:/var/lib/sumi
      - agent-runtime-identity:/run/sumi/identity:ro
      - agent-executor-ipc:/run/sumi/executor:ro
    depends_on:
      agent-allocator:
        condition: service_completed_successfully
      agent-prepare:
        condition: service_completed_successfully
      agent-executor:
        condition: service_started
      api:
        condition: service_healthy

  agent-executor:
    build:
      context: ../..
      dockerfile: deploy/agent/Dockerfile
    # Run the executor under the runtime UID so the IPC parent is uid-owned
    # and group-traversable by the runtime; keep the executor identity group
    # for reading its identity file.
    user: "10001:10002"
    command: [executor]
    network_mode: none
    cap_drop: [ALL]
    volumes:
      - agent-workspace:/workspace
      - agent-executor-identity:/run/sumi/identity:ro
      - agent-executor-ipc:/run/sumi/executor
    depends_on:
      agent-allocator:
        condition: service_completed_successfully
      agent-prepare:
        condition: service_completed_successfully

  agent-broker:
    build:
      context: ../..
      dockerfile: deploy/agent/Dockerfile
    user: "10003:10003"
    command: [broker]
    network_mode: none
    cap_drop: [ALL]
    volumes:
      - agent-artifacts:/var/lib/sumi-artifacts
      - agent-broker-identity:/run/sumi/identity:ro
      - agent-broker-ipc:/run/sumi/broker
    depends_on:
      agent-allocator:
        condition: service_completed_successfully
      agent-prepare:
        condition: service_completed_successfully

volumes:
  firebase-auth-data: {}
  sumi-postgres: {}
  api-command-log: {}
  api-runtime-state: {}
  local-control: {}
  agent-allocator-root: {}
  agent-allocator-state: {}
  agent-state: {}
  agent-workspace: {}
  agent-artifacts: {}
  agent-runtime-identity: {}
  agent-executor-identity: {}
  agent-broker-identity: {}
  agent-executor-ipc: {}
  agent-broker-ipc: {}

secrets:
  sumi_local_control_bearer:
    environment: SUMI_LOCAL_CONTROL_BEARER
  sumi_agent_wrapping_key:
    environment: SUMI_AGENT_WRAPPING_KEY
  sumi_approval_secret_digest_key:
    environment: SUMI_APPROVAL_SECRET_DIGEST_KEY
  sumi_provider_api_key:
    environment: SUMI_PROVIDER_API_KEY
