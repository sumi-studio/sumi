# Local control-plane compose: Postgres + Go API + Vite web + the privileged
# runtime provisioner. PersonalityAgent runtimes are separate PAID-derived
# Compose projects created lazily by the provisioner.
#
# Usage:
#   scripts/dev/compose-stack up
#   scripts/dev/compose-stack down
#
# Web, API, and every provisioned runtime keep distinct network namespaces.
# Web uses stable service DNS for its dev proxy; runtimes use the stable
# internal control-plane alias. The API receives neither Docker access nor
# agent-private volumes.

name: sumi-dev

services:
  firebase-auth:
    build:
      context: ../firebase
    environment:
      FIREBASE_PROJECT_ID: ${SUMI_AUTH_FIREBASE_PROJECT_ID:-sumi-studio}
      FIREBASE_AUTH_EXPORT_DIR: /var/lib/firebase/auth
    ports:
      - "${SUMI_DEV_BIND_HOST:-127.0.0.1}:9099:9099"
    volumes:
      - firebase-auth-data:/var/lib/firebase
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const net=require('node:net');
          const socket=net.connect(9099,'127.0.0.1',()=>{socket.end();process.exit(0)});
          socket.on('error',()=>process.exit(1));
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 5s
    stop_signal: SIGINT
    stop_grace_period: 30s
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sumi
      POSTGRES_PASSWORD: sumi-dev
      POSTGRES_DB: sumi
    # No host port is published; the API reaches postgres by hostname.
    volumes:
      - sumi-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sumi -d sumi"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 2s
    restart: "no"

  migrate:
    build:
      context: ../..
      dockerfile: deploy/api/Dockerfile
    # The image's ENTRYPOINT is sumi-api; override it to run the migrate binary.
    entrypoint: ["/usr/local/bin/sumi-migrate"]
    command: []
    environment:
      SUMI_DB_URL: ${SUMI_DB_URL:-postgres://sumi:sumi-dev@postgres:5432/sumi?sslmode=disable}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Prepare API state and local-control socket directories with the exact
  # ownership and modes the server expects.
  api-state-init:
    build:
      context: ../..
      dockerfile: deploy/api/Dockerfile
    user: "0:0"
    entrypoint: ["/busybox/sh"]
    command:
      - "-c"
      - |
        install -d -m 0700 -o 65532 -g 65532 /var/lib/sumi-command-log
        install -d -m 0700 -o 65532 -g 65532 /var/lib/sumi-runtime-state
        install -d -m 0750 -o 65532 -g 20000 /run/sumi/local-control
    cap_add: [CHOWN, FOWNER]
    volumes:
      - api-command-log:/var/lib/sumi-command-log
      - api-runtime-state:/var/lib/sumi-runtime-state
      - type: bind
        source: /run/sumi/local-control
        target: /run/sumi/local-control
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: deploy/api/Dockerfile
    user: "65532:20000"
    group_add:
      - "20000"
    cap_drop: [ALL]
    environment:
      SUMI_DB_URL: ${SUMI_DB_URL:-postgres://sumi:sumi-dev@postgres:5432/sumi?sslmode=disable}
      SUMI_COMMAND_LOG_DIR: /var/lib/sumi-command-log
      SUMI_AGENT_RUNTIME_STATE_DIR: /var/lib/sumi-runtime-state
      SUMI_AGENT_TOKEN_SECRET: ${SUMI_AGENT_TOKEN_SECRET:-}
      SUMI_BROWSER_SESSION_SECRET: ${SUMI_BROWSER_SESSION_SECRET:?SUMI_BROWSER_SESSION_SECRET is required}
      SUMI_BROWSER_SESSION_AUDIENCE: ${SUMI_BROWSER_SESSION_AUDIENCE:-sumi:web:direct-chat}
      SUMI_BROWSER_WS_ALLOWED_ORIGINS: ${SUMI_BROWSER_WS_ALLOWED_ORIGINS:?SUMI_BROWSER_WS_ALLOWED_ORIGINS is required}
      SUMI_AUTH_FIREBASE_PROJECT_ID: ${SUMI_AUTH_FIREBASE_PROJECT_ID:?SUMI_AUTH_FIREBASE_PROJECT_ID is required}
      SUMI_AUTH_FIREBASE_TENANT_ID: ${SUMI_AUTH_FIREBASE_TENANT_ID:-}
      SUMI_AUTH_TENANT_ID: ${SUMI_AUTH_TENANT_ID:-sumi-dev}
      SUMI_AUTH_ALLOW_INSECURE_COOKIES: ${SUMI_AUTH_ALLOW_INSECURE_COOKIES:-true}
      SUMI_AUTH_SESSION_TTL: ${SUMI_AUTH_SESSION_TTL:-1h}
      # API-side traffic stays inside the Compose network. Browsers use the
      # exact published host address configured on the web service below.
      FIREBASE_AUTH_EMULATOR_HOST: firebase-auth:9099
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      SUMI_LOCAL_CONTROL_ENABLED: "1"
      SUMI_LOCAL_CONTROL_ROOT: /run/sumi/local-control
      SUMI_LOCAL_CONTROL_SOCKET_GID: "20000"
      SUMI_LOCAL_CONTROL_TENANT_ID: ${SUMI_LOCAL_CONTROL_TENANT_ID:-sumi-dev}
      SUMI_LOCAL_CONTROL_DELIVERY_AUTHORIZATION: ${SUMI_LOCAL_CONTROL_DELIVERY_AUTHORIZATION:-raw}
      SUMI_RUNTIME_PROVISIONER_SOCKET: /run/sumi/runtime-provisioner/control.sock
      SUMI_AGENT_GATEWAY_URL: ws://sumi-agent-gateway:8080/agent/ws
      SUMI_ALLOW_INSECURE_LOOPBACK_GATEWAY: "true"
      SUMI_AGENT_WRAPPING_KEY_ID: ${SUMI_AGENT_WRAPPING_KEY_ID:-local-ephemeral/v1}
      SUMI_APPROVAL_SECRET_DIGEST_KEY: ${SUMI_APPROVAL_SECRET_DIGEST_KEY:?SUMI_APPROVAL_SECRET_DIGEST_KEY is required}
      SUMI_PROVIDER_API_KEY: ${SUMI_PROVIDER_API_KEY:?SUMI_PROVIDER_API_KEY is required}
      SUMI_MODEL_PRESET: ${SUMI_MODEL_PRESET:-kimi-k3}
    ports:
      - "${SUMI_DEV_BIND_HOST:-127.0.0.1}:8080:8080"
    volumes:
      - api-command-log:/var/lib/sumi-command-log
      - api-runtime-state:/var/lib/sumi-runtime-state
      - type: bind
        source: /run/sumi/local-control
        target: /run/sumi/local-control
      - provisioner-control:/run/sumi/runtime-provisioner
    depends_on:
      api-state-init:
        condition: service_completed_successfully
      firebase-auth:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      runtime-provisioner:
        condition: service_healthy
    networks:
      default: {}
      control-plane:
        aliases:
          - sumi-agent-gateway
    healthcheck:
      test: ["CMD", "/busybox/wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 5s
    restart: "no"
    stop_grace_period: 2m

  # This is the sole Docker authority. API/runtime/executor/broker containers
  # have no Docker socket, client, or host-process execution capability.
  runtime-provisioner:
    build:
      context: ../..
      dockerfile: deploy/provisioner/Dockerfile
    user: "0:0"
    command:
      - -socket
      - /run/sumi/runtime-provisioner/control.sock
      - -socket-gid
      - "20000"
      - -supervisor
      - /opt/sumi/deploy/agent/supervisor
    environment:
      SUMI_CONTROL_PLANE_NETWORK: sumi-control-plane
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - provisioner-control:/run/sumi/runtime-provisioner
      - type: bind
        source: /run/sumi/local-control
        target: /run/sumi/local-control
    depends_on:
      api-state-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "test", "-S", "/run/sumi/runtime-provisioner/control.sock"]
      interval: 1s
      timeout: 2s
      retries: 30
    restart: "no"
    stop_grace_period: 2m

  web:
    build:
      context: ../..
      dockerfile: deploy/web/Dockerfile
    # Vite binds the same exact host IPv4 as the public API. Host networking is
    # required because binding that address inside a private bridge namespace
    # would make Docker's published port unreachable without widening to
    # 0.0.0.0.
    network_mode: host
    # Do not inherit deploy/web's wildcard CLI bind. Without this override the
    # CLI would take precedence over vite.config.ts and expose every host
    # interface despite SUMI_DEV_HOST.
    command: ["pnpm", "dev", "--port", "5173"]
    environment:
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
      VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
      VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
      VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
      VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
      VITE_FIREBASE_MEASUREMENT_ID: ${VITE_FIREBASE_MEASUREMENT_ID:-}
      VITE_FIREBASE_AUTH_EMULATOR_URL: ${VITE_FIREBASE_AUTH_EMULATOR_URL:?VITE_FIREBASE_AUTH_EMULATOR_URL is required}
      # Vite proxies browser /auth and /direct-chat to the API's exact host
      # address. The browser itself stays same-origin on port 5173.
      SUMI_DEV_HOST: ${SUMI_DEV_BIND_HOST:-127.0.0.1}
      SUMI_DEV_API_ORIGIN: http://${SUMI_DEV_BIND_HOST:-127.0.0.1}:8080
    depends_on:
      api:
        condition: service_healthy
    restart: "no"

volumes:
  firebase-auth-data: {}
  sumi-postgres: {}
  api-command-log: {}
  api-runtime-state: {}
  provisioner-control: {}

networks:
  control-plane:
    external: true
    name: sumi-control-plane
