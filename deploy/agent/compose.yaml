# T26 deterministic local/CI deployment boundary. The runtime never mounts
# workspace or artifacts; executor and broker have separate UIDs, roots and
# network namespaces. T27 owns execution cgroups, quotas and crash recovery.
name: sumi-agent

x-sidecar-hardening: &sidecar-hardening
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
    - seccomp:./seccomp/sidecar.json
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=32m

services:
  init:
    build:
      context: ../..
      dockerfile: deploy/agent/Dockerfile
    user: "0:0"
    command: [init]
    read_only: true
    cap_drop: [ALL]
    # Init alone needs these three capabilities to set named-volume ownership
    # and run the allocator as the runtime UID. Long-lived services get none.
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
      - seccomp:./seccomp/sidecar.json
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    volumes:
      - state:/var/lib/sumi
      - runtime-state:/var/lib/sumi-runtime-state
      - workspace:/workspace
      - artifacts:/var/lib/sumi-artifacts
      - runtime-ipc:/run/sumi/runtime
      - broker-ipc:/run/sumi/broker

  runtime:
    <<: *sidecar-hardening
    build:
      context: ../..
      dockerfile: deploy/agent/Dockerfile
    user: "10001:10001"
    group_add: ["10010"]
    command: [runtime]
    environment:
      SUMI_TENANT_ID: ${SUMI_TENANT_ID:?SUMI_TENANT_ID is required}
      SUMI_AGENT_ID: ${SUMI_AGENT_ID:?SUMI_AGENT_ID is required}
      SUMI_CONVERSATION_ID: ${SUMI_CONVERSATION_ID:?SUMI_CONVERSATION_ID is required}
      SUMI_AGENT_WRAPPING_KEY: ${SUMI_AGENT_WRAPPING_KEY:?SUMI_AGENT_WRAPPING_KEY is required}
      SUMI_PROVIDER_API_KEY: ${SUMI_PROVIDER_API_KEY:?SUMI_PROVIDER_API_KEY is required}
      SUMI_MODEL_PRESET: ${SUMI_MODEL_PRESET:-kimi-k3}
      SUMI_AGENT_RUNTIME_STATE_DIR: /var/lib/sumi-runtime-state
    depends_on:
      init:
        condition: service_completed_successfully
      executor:
        condition: service_healthy
    volumes:
      - state:/var/lib/sumi
      - runtime-state:/var/lib/sumi-runtime-state
      - runtime-ipc:/run/sumi/runtime:ro

  executor:
    <<: *sidecar-hardening
    build:
      context: ../..
      dockerfile: deploy/agent/Dockerfile
    user: "10002:10002"
    group_add: ["10010"]
    command: [executor]
    network_mode: none
    environment:
      SUMI_CONVERSATION_ID: ${SUMI_CONVERSATION_ID:?SUMI_CONVERSATION_ID is required}
    # The sumi-agent-executor AppArmor profile must be loaded on the host
    # before `docker compose up`; run apparmor_parser -r ./apparmor/executor.
    security_opt:
      - no-new-privileges:true
      - seccomp:./seccomp/sidecar.json
      - apparmor:sumi-agent-executor
    depends_on:
      init:
        condition: service_completed_successfully
      broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "SUMI_READINESS_SOCKET=/run/sumi/runtime/executor.sock /usr/local/bin/sumi-agent --check-unix-socket"]
      interval: 5s
      timeout: 6s
      retries: 3
      start_period: 5s
    volumes:
      - workspace:/workspace
      - runtime-ipc:/run/sumi/runtime
      - broker-ipc:/run/sumi/broker:ro

  broker:
    <<: *sidecar-hardening
    build:
      context: ../..
      dockerfile: deploy/agent/Dockerfile
    user: "10003:10003"
    group_add: ["10010"]
    command: [broker]
    network_mode: none
    healthcheck:
      test: ["CMD-SHELL", "SUMI_READINESS_SOCKET=/run/sumi/broker/broker.sock /usr/local/bin/sumi-agent --check-unix-socket"]
      interval: 5s
      timeout: 6s
      retries: 3
      start_period: 5s
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - artifacts:/var/lib/sumi-artifacts
      - broker-ipc:/run/sumi/broker

volumes:
  state: {}
  runtime-state: {}
  workspace: {}
  artifacts: {}
  runtime-ipc: {}
  broker-ipc: {}
