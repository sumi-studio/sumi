# Local secrets can be stored in apps/agent/.env.local:
# OPENCODE_GO_API_KEY=...
#
# Load it explicitly with SUMI_ENV_FILE=.env.local. Existing process
# environment variables take precedence over values in the file.

# Required unless SUMI_PERSONALITY_AGENT_ID is set; must be a canonical UUIDv7.
personality_agent_id = "0198f0f4-9b72-7000-8000-000000000001"
workspace = "/workspace"
# 相対パスはこの設定ファイルの場所を基準に解決される。
# system_prompt (インライン文字列) との同時指定はエラー。
system_prompt_file = "prompts/system.md"

[model]
preset = "opencode-go"
# id = "kimi-k2.7-code"
# base_url = "https://opencode.ai/zen/go/v1"
# api_key_env = "OPENCODE_GO_API_KEY"
# context_window = 262144
# max_output_tokens = 32768
# default_output_tokens = 16384 # Normal request budget; model context is 262144.
# Cumulative wire/content/event/tool/preview-work limits are derived from the
# actual request output-token budget; unrepresentable limits fail at config load.

# Provider measurements can override preset compatibility without recompiling.
# [model.compat]
# max_tokens_field = "max_tokens"
# supports_usage_in_streaming = true
# thinking_format = "deepseek"
# requires_reasoning_content_on_assistant = true
# zai_tool_stream = false
# supports_required_tool_choice = false

# Both AutoReviews need structured-output-capable ModelSpecs. When a reviewer
# block is absent, it inherits [model] completely. A partial block can select a
# dedicated model id while inheriting the conversation preset and credential;
# preset, endpoint, account scope, and credential may also be overridden.
#
# [reviewers.execution]
# id = "<dedicated-execution-reviewer-model>"
# preset = "<optional-structured-output-capable-preset>"
# api_key_env = "<optional-reviewer-api-key-env>"
#
# [reviewers.escalation]
# id = "<dedicated-escalation-reviewer-model>"
# preset = "<optional-structured-output-capable-preset>"
# api_key_env = "<optional-reviewer-api-key-env>"

# Notification reflex: opt-in selection on the SAME user connection as the parent.
# No default lightweight model is purchased/chosen by Sumi. With neither field
# set, the current parent model and effort are inherited. Environment overrides:
# SUMI_REFLEX_MODEL_ID and SUMI_REFLEX_REASONING_EFFORT.
# [reflex]
# model_id = "<smaller-model-id-supported-by-this-connection>"
# reasoning_effort = "low"
# Only these two fields are supported; endpoint/account/credentials cannot change.
# The selected model must accept the parent's complete context, images, protocol,
# and request budget. Unsupported requests use the existing original-event soft
# fallback, never a silent retry with the more expensive parent model. Native
# opaque replay or model-bound thinking cannot be dropped to make a model switch
# fit, so those snapshots also fall back softly. Effort-only changes keep the
# parent model and exact replay. The parent prompt/options are never mutated.
