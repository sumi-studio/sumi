[package]
name = "sumi-agent"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
name = "sumi_agent_doctest"
path = "src/lib.rs"
test = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
ed25519-dalek = "2"
futures-util = "0.3"
hmac = "0.12"
jsonschema = { version = "0.48", default-features = false }
libc = "0.2"
libsqlite3-sys = "0.30"
mime_guess = "2"
rand = "0.9"
regex = "1"
reqwest = { version = "0.12", features = ["json", "multipart", "stream", "rustls-tls"], default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
subtle = "2"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "json", "chrono"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "process", "sync", "time", "io-util", "io-std", "fs", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
# The WebSocket transport intentionally uses the bundled public Web PKI roots
# from `webpki-roots`. Enterprise or native OS trust roots require an explicit
# future configuration/contract and must not be silently blended here.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v7", "v5", "serde"] }
zeroize = "1"

[dev-dependencies]
axum = "0.8"
serde_yaml = "0.9"
tokio = { version = "1", features = ["test-util"] }
