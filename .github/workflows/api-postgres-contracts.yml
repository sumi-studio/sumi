name: API Postgres contracts

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  api-postgres-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_test_admin
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SUMI_TEST_DB_URL: postgres://sumi_test_creator:sumi_test_password@localhost:5432/postgres?sslmode=disable

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify migration history against exact base commit
        env:
          MIGRATION_FREEZE_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          MIGRATION_FREEZE_EVENT_NAME: ${{ github.event_name }}
          MIGRATION_FREEZE_PUSH_DELETED: ${{ github.event_name == 'push' && github.event.deleted || false }}
        run: |
          if [[ "${MIGRATION_FREEZE_EVENT_NAME}" == "push" && "${MIGRATION_FREEZE_PUSH_DELETED}" == "true" ]]; then
            echo "ref deletion has no candidate migration tree to verify" >&2
            exit 1
          fi

          if [[ ! "${MIGRATION_FREEZE_BASE_SHA}" =~ ^[0-9a-f]{40}$ ]] || \
             [[ "${MIGRATION_FREEZE_BASE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
            echo "migration freeze base must be a nonzero lowercase 40-hex commit SHA" >&2
            exit 1
          fi

          if ! git cat-file -e "${MIGRATION_FREEZE_BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "${MIGRATION_FREEZE_BASE_SHA}"
          fi
          git cat-file -e "${MIGRATION_FREEZE_BASE_SHA}^{commit}"

          node --test ../../scripts/dev/migration-freeze.test.mjs
          node ../../scripts/dev/migration-freeze.mjs verify-base "${MIGRATION_FREEZE_BASE_SHA}"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Create constrained database test role
        run: |
          docker exec "${{ job.services.postgres.id }}" \
            psql --username postgres --dbname postgres --set ON_ERROR_STOP=1 \
            --command "CREATE ROLE sumi_test_creator WITH LOGIN CREATEDB NOSUPERUSER NOCREATEROLE NOREPLICATION PASSWORD 'sumi_test_password'"

      - name: Run API contract tests
        run: go test -count=1 ./...
